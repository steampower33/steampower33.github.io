<!-- 공통 상단 바. include.active 에 study 를 넘기면 Study 메뉴가 강조된다. -->
{% assign home = '/' | relative_url %}
<header class="topbar" id="topbar">
  <div class="wrap">
    <a class="brand" href="{{ home }}">{{ site.social.name }}</a>
    <nav class="nav" aria-label="Main">
      <a href="{{ home }}#work">Work</a>
      <!-- 별도 저장소(steampower33/gallery)의 WebGPU 갤러리 사이트로 바로 간다. 주소는 _config.yml 의 gallery_url. -->
      <a href="{{ site.gallery_url }}">Gallery</a>
      <a href="{{ '/study/' | relative_url }}"{% if include.active == 'study' %} class="active" aria-current="page"{% endif %}>Study</a>
      <a class="icon" href="https://github.com/{{ site.github.username }}" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a class="icon" href="mailto:{{ site.social.email }}" aria-label="Email"><i class="fas fa-envelope"></i></a>
    </nav>
  </div>
</header>
