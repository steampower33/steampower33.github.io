      url: https://github.com/steampower33/SPH-PBF-Solver-DX12
      icon: fab fa-github
    - label: Demo
      url: https://www.youtube.com/watch?v=kDXEbfrF-uI
      icon: fas fa-play
    - label: 1M Performance
      url: https://www.youtube.com/watch?v=OuQbcxNxZGo
      icon: fas fa-play
    - label: Write-up
      url: https://app.notion.com/p/DX12-100-PBF-30dfcfd1c8e080eaaa68c4ff985e817f
      icon: fas fa-file-lines

- id: xpbd-cloth
  title: GPU XPBD Cloth Simulation
  api: Vulkan
  tech: [C++, Vulkan, GLSL, Compute Shader]
  period: 2025.10 – 2026.01
  youtube: nu1VZo1UNBs
  summary: >-
    Vulkan Compute Shader로 XPBD 천 시뮬레이션을 구현했습니다.
    Constraint Solver를 GPU로 병렬화할 때 생기는 Write Conflict를
    Stretch는 Graph Coloring 기반 Gauss-Seidel-style, 나머지는 Atomic Add 기반 Jacobi-style 경로로 나눠 처리했습니다.
    Jitter와 발산은 Correction Averaging, Relaxation, Multi-Substep을 조합하고 값을 경험적으로 조정해 줄였습니다.
  stats:
    - value: "63,001"
      label: Particles
      note: 251 × 251 cloth
    - value: "~751K"
      label: Generated Constraints
      note: Stretch / Shear / Bend / Area / LRA
    - value: "7.4 ms"
      label: Recorded Physics Step
      note: RTX 4060 Laptop GPU
  highlights:
    - title: XPBD Cloth Solver
      body: Stretch, Shear, Bend, Area Constraint, Long Range Attachments. 기본 설정 10 Substeps × 4 Solver Iterations
    - title: Graph Coloring Stretch Solver
      body: Vertex를 공유하지 않는 Constraint끼리 Color Group을 만들어 같은 Color 안에서 병렬 실행, Color Pass 사이 동기화와 In-place 업데이트
    - title: Atomic Jacobi-style Solver
      body: Shear / Bend / Area / Self-Collision 보정을 Atomic Add로 누적한 뒤 ApplyDeltas Pass에서 Averaging / Relaxation
    - title: Self-Collision Broadphase
      body: Spatial Hashing, vulkan_radix_sort 라이브러리를 통합한 GPU Radix Sort, Cell Range와 Neighbor List 구성. Neighbor List는 Substep 사이에 재사용
    - title: Analytic SDF Collision
      body: Sphere, Plane, Capsule
    - title: Compute ↔ Graphics
      body: Compute에서 갱신한 Position으로 Triangle / Vertex Normal을 재구성해 렌더링 파이프라인과 연동
  footnote: 7.4 ms는 RTX 4060 Laptop GPU에서 특정 Scene / Solver 설정으로 기록한 GPU Physics Workload이며 전체 Frame Time이나 FPS가 아닙니다. Pass별 Breakdown 자료는 남아 있지 않습니다.
  links:
