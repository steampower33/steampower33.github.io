- id: pbf-fluid
  title: 100만 파티클 PBF Fluid Simulation
  api: DirectX 12
  tech: [C++, DirectX 12, HLSL, Compute Shader, PIX]
  period: 2026.02
  youtube: OuQbcxNxZGo
  summary: >-
    DirectX 12 Compute Shader로 Position Based Fluids 유체 시뮬레이션과
    Screen Space Fluid Rendering 파이프라인을 구현했습니다.
    100만 개 파티클을 GPU에서 처리하고, PIX로 병목을 분석해 정렬과 메모리 접근 구조를 개선했습니다.
  stats:
    - value: "1,000,000"
      label: Fluid Particles
    - value: "86.9%"
      label: Sort Time 감소
      note: 5.19 ms → 0.68 ms
    - value: "28.4 ms"
      label: PBF + SSFR GPU Frame
  highlights:
    - title: GPU PBF Solver
      body: Integration, Spatial Hashing, Density / Lambda, Delta Position, Constraint Solve, Vorticity / Velocity Update
    - title: Spatial Hash Neighbor Search
      body: Uniform Grid로 공간 분할 후 Cell Key 기준 정렬, 파티클 데이터 자체를 Grid 순서로 재배열해 Neighbor-heavy Pass의 메모리 접근 개선
    - title: GPU Sorting 최적화
      body: Bitonic Sort에서 정수 Cell Key 특성을 이용한 Counting Sort 파이프라인으로 교체. 2^20 파티클 기준 5.19 ms → 0.68 ms
    - title: Resource / Synchronization
      body: Pass별 UAV / SRV 접근 패턴 분리, Resource State Transition과 Barrier 관리, PIX Hardware Counter 기반 프로파일링
    - title: Screen Space Fluid Rendering
      body: Linear Depth, Separable Bilateral Blur, Thickness, Normal Reconstruction, Reflection / Refraction
    - title: GPU-Driven Diffuse Particle
      body: ExecuteIndirect 기반 렌더링으로 Active Particle Count의 CPU Readback 제거
  links:
