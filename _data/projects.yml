- id: pbf-fluid
  title: GPU PBF Fluid Simulation
  api: DirectX 12
  tech: [C++, DirectX 12, HLSL, Compute Shader, PIX]
  period: 2026.02
  youtube: OuQbcxNxZGo
  summary: >-
    DirectX 12 Compute Shader로 Position Based Fluids 유체 시뮬레이션과
    Screen Space Fluid Rendering 파이프라인을 구현했습니다.
    파티클 수를 100만 개까지 늘리면서 PIX로 Pass별 GPU Time을 측정했고,
    병목이던 정렬을 Counting Sort 기반으로 교체했습니다.
    최종 파이프라인에서는 Neighbor Search / Solver Iteration이 가장 큰 비용으로 남아 있습니다.
  stats:
    - value: "1,000,000"
      label: Fluid Particles
      note: "RTX 4060 Laptop GPU에서 측정"
    - value: "0.68 ms"
      label: Counting Sort
      note: "Bitonic 5.19 ms 대비 · 2^20 particles"
    - value: "28.4 ms"
      label: PBF + SSFR GPU Frame
      note: "PBF 25.2 ms + SSFR 3.2 ms · Diffuse 제외"
  highlights:
    - title: GPU PBF Solver
      body: Integration, Spatial Hashing, Density / Lambda (Poly6, Spiky), Delta Position, Constraint Apply, Vorticity, XSPH Viscosity / Velocity Update
    - title: Spatial Hash Neighbor Search
      body: Uniform Grid로 공간 분할 후 Cell Key 기준 정렬, 파티클 데이터 자체를 Grid 순서로 재배열해 인접 Cell의 파티클이 메모리에서도 가깝게 놓이도록 구성
    - title: GPU Sorting 교체
      body: Bitonic Sort의 초기 단계를 Group Shared Memory로 옮긴 뒤(10만 파티클 기준 1.52 ms → 1.01 ms), 정수 Cell Key 특성을 이용한 Counting Sort 파이프라인으로 교체. 2^20 파티클 기준 5.19 ms → 0.68 ms
    - title: Resource State 관리
      body: Pass별 UAV / SRV 접근 패턴 분리, Read-only Pass는 Resource Barrier 후 SRV로 바인딩. 변경 전후를 PIX Hardware Counter로 확인
    - title: Screen Space Fluid Rendering
      body: Linear Depth, Separable Bilateral Blur, Thickness, Normal Reconstruction, Fresnel / Reflection / Refraction
    - title: GPU-Driven Diffuse Particle
      body: Spray / Foam / Bubble 분류, Compute Shader에서 Dispatch / Draw Argument를 만들어 ExecuteIndirect로 실행, Active Particle Count의 CPU Readback 제거
  footnote: "28.4 ms는 RTX 4060 Laptop GPU에서 Diffuse Simulation / Rendering을 끄고 Fluid 100만 개로 측정한 GPU Frame Time입니다. 활성 Diffuse Particle 약 180만 개 조건에서는 약 12.2 ms가 추가되어 약 40.6 ms였습니다."
  links:
