      url: https://app.notion.com/p/DX12-100-PBF-30dfcfd1c8e080eaaa68c4ff985e817f
      icon: fas fa-file-lines

- id: xpbd-cloth
  title: GPU XPBD Cloth Simulation
  api: Vulkan
  tech: [C++, Vulkan, GLSL, Compute Shader]
  period: 2025.10 – 2026.01
  youtube: nu1VZo1UNBs
  summary: >-
    Vulkan Compute Shader로 XPBD 천 시뮬레이션을 구현했습니다.
    Constraint Solver를 GPU로 병렬화할 때 생기는 Write Conflict와 안정성 문제를
    Graph Coloring 기반 Gauss-Seidel과 Atomic Jacobi 솔버로 나눠 다뤘습니다.
  stats:
    - value: "63,001"
      label: Particles
      note: 251 × 251 cloth
    - value: "~751K"
      label: Constraints
    - value: "7.4 ms"
      label: Physics Step
  highlights:
    - title: XPBD Cloth Solver
      body: Stretch, Shear, Bend, Area Constraint
    - title: Graph Coloring Stretch Solver
      body: Vertex를 공유하지 않는 Constraint끼리 Color Group을 만들어 같은 Color 안에서 병렬 실행, Color Pass 사이 동기화와 In-place 업데이트
    - title: Atomic Jacobi-style Solver
      body: Shear / Bend / Area / Self-Collision 보정을 Atomic Add로 누적한 뒤 ApplyDeltas Pass에서 Averaging / Relaxation
    - title: Self-Collision Broadphase
      body: Spatial Hashing, GPU Radix Sort, Cell Range와 Neighbor List 구성
    - title: Analytic SDF Collision
      body: Sphere, Plane, Capsule
    - title: Compute ↔ Graphics
      body: Compute에서 갱신한 Position으로 Triangle / Vertex Normal을 재구성해 렌더링 파이프라인과 연동
  footnote: 7.4 ms는 특정 Scene / Solver 설정에서 측정한 GPU Physics Workload이며 전체 Frame Time이 아닙니다.
  links:
    - label: GitHub
      url: https://github.com/steampower33/XPBD-Cloth
      icon: fab fa-github
    - label: Demo
      url: https://www.youtube.com/watch?v=nu1VZo1UNBs
      icon: fas fa-play
    - label: Write-up
      url: https://app.notion.com/p/Vulkan-GPU-XPBD-Cloth-Simulation-3c9fcfd1c8e080c489c3c7b4b9df6188
      icon: fas fa-file-lines
